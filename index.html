<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>HYPER TV</title>
  <style>
    body {
      margin: 0;
      background: #000;
      color: #fff;
      font-family: Arial, sans-serif;
      overflow: hidden;
    }
    header {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 2em;
      font-weight: bold;
      background: linear-gradient(to right, #ff0080, #7928ca);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      z-index: 10;
    }
    #videoPlayer {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      width: 70%;
      border: 2px solid #666;
      border-radius: 12px;
      background: #000;
      z-index: 10;
    }
  </style>
</head>
<body>
  <header>🌍 HYPER TV</header>

  <video id="videoPlayer" controls autoplay></video>

  <!-- Three.js + Globe -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three-globe@2.30.0/dist/three-globe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.158.0/examples/js/controls/OrbitControls.js"></script>

  <script>
    const width = window.innerWidth;
    const height = window.innerHeight;

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(width, height);
    document.body.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 2000);
    camera.position.z = 400;

    // Globe
    const globe = new ThreeGlobe()
      .globeImageUrl('//unpkg.com/three-globe/example/img/earth-night.jpg');

    scene.add(globe);

    // Light
    const ambientLight = new THREE.AmbientLight(0xffffff, 1);
    scene.add(ambientLight);

    // Controls
    const controls = new THREE.OrbitControls(camera, renderer.domElement);

    // Dummy channels per country (you can add more)
    const channels = {
      "USA": "https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8",
      "India": "https://test-streams.mux.dev/test_001/stream.m3u8",
      "UK": "https://moiptvhls-i.akamaihd.net/hls/live/652318/moiptvhls/master.m3u8",
      "Japan": "https://bitdash-a.akamaihd.net/content/sintel/hls/playlist.m3u8"
    };

    // Convert country data into clickable points
    const countries = [
      { lat: 38, lng: -97, name: "USA" },
      { lat: 20, lng: 77, name: "India" },
      { lat: 55, lng: -3, name: "UK" },
      { lat: 36, lng: 138, name: "Japan" }
    ];

    globe
      .labelsData(countries)
      .labelLat(d => d.lat)
      .labelLng(d => d.lng)
      .labelText(d => d.name)
      .labelSize(1.5)
      .labelColor(() => "orange")
      .onLabelClick(d => {
        const player = document.getElementById("videoPlayer");
        player.src = channels[d.name];
        player.play();
      });

    // Animate
    function animate() {
      requestAnimationFrame(animate);
      globe.rotation.y += 0.001;
      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
